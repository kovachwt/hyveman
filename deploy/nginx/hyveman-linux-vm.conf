# Hyveman — single-file nginx site: static frontend + reverse proxy for hyveman-api
#
# Security headers are inlined here (previously a separate
# hyveman-security-headers.conf snippet); this file is the deployed source
# of truth. Set server_name to the real FQDN and root to wherever the SPA is
# published (deploy via tools/deploy-web.sh) before installing.
#
# Install:
#   sudo cp deploy/nginx/hyveman-linux-vm.conf /etc/nginx/sites-available/hyveman
#   sudo ln -s ../sites-available/hyveman /etc/nginx/sites-enabled/hyveman
#   sudo rm /etc/nginx/sites-enabled/default     # optional; only the nginx welcome page
#   sudo mkdir -p /var/www/hyveman               # deploy the vite build output here
#   sudo nginx -t
#   sudo systemctl enable --now nginx
#
# TLS with Let's Encrypt (once the DNS name for this host exists):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx --redirect --hsts -d <fqdn>
# certbot rewrites this file in place: it adds the 443 listener, certificate
# paths, the HTTP->HTTPS redirect, and the Strict-Transport-Security header.
# Re-commit the file afterwards so the repo matches the deployed state.
#
# Requirements (docs/FRONTEND.md §3/§13, docs/API.md §11-12):
# - server_name must be a real FQDN resolving to this host. certbot's HTTP-01
#   challenge needs public port 80 reachable. If the name is not publicly
#   resolvable, use a certbot DNS-01 plugin or an internal CA instead.
# - hyveman-api runs on this host with ApiListenUrls=http://127.0.0.1:5080
#   (the default in Options.cs). The API trusts X-Forwarded-* only from
#   loopback proxies (Program.cs ForwardedHeadersOptions), so nginx must be
#   on the same host; a remote proxy would need KnownProxies entries.
# - The vite build output (dist/) is deployed to /var/www/hyveman/current
#   (versioned release dirs + symlink swap; see INSTALL.md §5.3).
# - The API's PublicOrigin / WebAuthnRpId / WebAuthnExpectedOrigin must be
#   set to https://<fqdn> (config.json in the API data directory).
# - The web root must not be world-writable; keep dotfiles out of it
#   (the deny-all rule below only protects against accidental exposure).

server {
    listen 80;
    listen [::]:80;

    # TODO: replace with the real FQDN before running certbot.
    server_name hyveman.example.com;

    server_tokens off;

    # ── Frontend ──────────────────────────────────────────────────────────
    # tools/deploy-web.sh publishes to $HOME/www/hyveman/current — point root
    # at that path instead if you deploy from a home directory.
    root /var/www/hyveman/current;
    index index.html;

    # Agent ingest batches can reach the API's 4 MiB protocol cap
    # (PROTOCOL.md §12 max_batch_bytes). Keep nginx above that so the API,
    # not nginx, produces the protocol-shaped 413 payload_too_large response.
    client_max_body_size 8m;

    # ── Security headers (API.md §12: applied at the proxy boundary) ──────
    # Inlined from deploy/nginx/hyveman-security-headers.conf (this file is
    # a single-file variant: no snippet install needed).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;

    # ── Compression (static assets + API JSON) ────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_proxied any;

    # ── Cache policy (FRONTEND.md §3/§13) ─────────────────────────────────
    # index.html: always revalidate (ETag/Last-Modified -> 304).
    location = /index.html {
        expires -1;
    }

    # Hashed JS/CSS/fonts from vite (build.assetsDir "assets"): long-lived
    # immutable cache. This location sets its own add_header, so the
    # security headers are included explicitly (they are not inherited).
    location /assets/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── hyveman-api and agent protocol passthrough (never SPA fallback) ───
    # Web API (browser, /api/v1/...).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Agent registration (PROTOCOL.md §5). Exact match: only POST /register.
    location = /register {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Agent ingest (PROTOCOL.md §6): /ingest/logs, /ingest/telemetry.
    location ^~ /ingest/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Agent protocol health (PROTOCOL.md §7) + API operational probes
    # /health/live and /health/ready (API.md §6.5).
    location ^~ /health {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Never serve dotfiles (stray .git/.env/backups in the web root). The
    # exact-match location certbot installs for ACME challenges takes
    # precedence over this regex, so /.well-known/ issuance still works.
    location ~ /\. {
        deny all;
    }

    # ── SPA fallback: every remaining path is a frontend route ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
