# Security headers applied at the Hyveman reverse-proxy boundary
# (docs/API.md §12, docs/FRONTEND.md §11).
#
# Included by deploy/nginx/hyveman.conf at server level and in every
# location that sets its own add_header (which would otherwise replace
# the inherited set). Install alongside the site config:
#   sudo cp deploy/nginx/hyveman-security-headers.conf /etc/nginx/snippets/

# The vite build has no inline scripts; MUI/Emotion injects inline styles,
# hence style-src 'unsafe-inline'. API calls and WebAuthn ceremonies are
# same-origin (connect-src 'self').
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
